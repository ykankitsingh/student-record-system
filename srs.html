<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Record Management System</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .grid-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .search-box {
      margin-bottom: 1rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge-pass { background-color: #dcfce7; color: #15803d; }
    .badge-fail { background-color: #fee2e2; color: #b91c1c; }

    .btn-delete {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 0.35rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      background-color: var(--danger-hover);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Student Record Portal</h1>
      <p>Manage student details, roll numbers, branches, and marks</p>
    </header>

    <div class="grid-container">
      <!-- Left Column: Registration Form -->
      <div class="card">
        <h2>Add New Student</h2>
        <form id="studentForm">
          <div class="form-group">
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" placeholder="e.g., Aarav Sharma" required>
          </div>
          
          <div class="form-group">
            <label for="rollNo">Roll Number</label>
            <input type="text" id="rollNo" placeholder="e.g., 101" required>
          </div>

          <div class="form-group">
            <label for="branch">Branch</label>
            <select id="branch" required>
              <option value="">Select Branch</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics">Electronics</option>
              <option value="Mechanical">Mechanical</option>
              <option value="Civil">Civil</option>
            </select>
          </div>

          <div class="form-group">
            <label for="marks">Marks (%)</label>
            <input type="number" id="marks" min="0" max="100" placeholder="e.g., 85" required>
          </div>

          <button type="submit" class="btn">Add Student</button>
        </form>
      </div>

      <!-- Right Column: Student List Table -->
      <div class="card">
        <h2>Student Directory</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by name or roll number...">
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Branch</th>
                <th>Marks</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <!-- Dynamic Rows Added Here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initial sample Indian student records
    const initialStudents = [
      { id: 101, name: "Aarav Sharma", branch: "Computer Science", marks: 92 },
      { id: 102, name: "Priya Patel", branch: "Information Technology", marks: 88 },
      { id: 103, name: "Rohan Verma", branch: "Mechanical", marks: 38 },
      { id: 104, name: "Ananya Iyer", branch: "Electronics", marks: 95 }
    ];

    // Retrieve from LocalStorage or initialize with sample data
    let students = JSON.parse(localStorage.getItem('student_records')) || initialStudents;

    const studentForm = document.getElementById('studentForm');
    const studentTableBody = document.getElementById('studentTableBody');
    const searchInput = document.getElementById('searchInput');

    // Save records to LocalStorage
    function saveToLocalStorage() {
      localStorage.setItem('student_records', JSON.stringify(students));
    }

    // Render Student Table
    function renderStudents(dataToDisplay = students) {
      studentTableBody.innerHTML = '';

      if (dataToDisplay.length === 0) {
        studentTableBody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state">No student records found.</td>
          </tr>`;
        return;
      }

      dataToDisplay.forEach((student, index) => {
        const isPassed = student.marks >= 40;
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>#${student.id}</strong></td>
          <td>${student.name}</td>
          <td>${student.branch}</td>
          <td>${student.marks}%</td>
          <td>
            <span class="badge ${isPassed ? 'badge-pass' : 'badge-fail'}">
              ${isPassed ? 'Pass' : 'Fail'}
            </span>
          </td>
          <td>
            <button class="btn-delete" onclick="deleteStudent(${student.id})">Delete</button>
          </td>
        `;
        studentTableBody.appendChild(row);
      });
    }

    // Add New Student
    studentForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('studentName').value.trim();
      const id = parseInt(document.getElementById('rollNo').value.trim());
      const branch = document.getElementById('branch').value;
      const marks = parseInt(document.getElementById('marks').value);

      // Check for duplicate Roll Number
      if (students.some(s => s.id === id)) {
        alert("A student with this Roll Number already exists!");
        return;
      }

      const newStudent = { id, name, branch, marks };
      students.push(newStudent);
      saveToLocalStorage();
      renderStudents();

      studentForm.reset();
    });

    // Delete Student
    function deleteStudent(id) {
      if (confirm(`Are you sure you want to delete student record #${id}?`)) {
        students = students.filter(student => student.id !== id);
        saveToLocalStorage();
        renderStudents();
      }
    }

    // Search / Filter Functionality
    searchInput.addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      const filtered = students.filter(student => 
        student.name.toLowerCase().includes(query) || 
        student.id.toString().includes(query) ||
        student.branch.toLowerCase().includes(query)
      );
      renderStudents(filtered);
    });

    // Initial load
    renderStudents();
  </script>
</body>
</html>
